# Copy to .github/workflows/pdf.yml in your docs repo.
#
# Rebuilds the PDF whenever the docs change on main (GitBook Git Sync pushes
# there) and keeps it as a downloadable workflow artifact. Also runnable by
# hand from the Actions tab.

name: Docs PDF

on:
  push:
    branches: [main]
    paths: ['docs/**']          # your space directory
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest      # the action needs a Linux runner
    steps:
      - uses: actions/checkout@v7

      - id: pdf
        uses: John-GitHub-Tests/gitbook-pdf@v1
        with:
          space: docs                     # directory containing SUMMARY.md
          # web-base: https://docs.example.com
          # output-name: handbook.pdf
          # cover-color: '#0043CE'
          # logo-path: assets/logo.png

      - uses: actions/upload-artifact@v7
        with:
          name: docs-pdf
          path: ${{ steps.pdf.outputs.pdf-path }}
          retention-days: 30
